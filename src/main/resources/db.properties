# ====================================================================
# Soft Nexis - Task 3: Database Integration with JDBC
# Database Configuration & HikariCP Pool Properties
# ====================================================================

# Database Connection Settings
db.url=jdbc:postgresql://localhost:5432/contactdb
db.username=admin
db.password=secret
db.driver=org.postgresql.Driver

# HikariCP Connection Pool Settings
db.pool.name=SoftNexisContactPool
db.pool.maxSize=20
db.pool.minIdle=5
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
db.pool.testQuery=SELECT 1

